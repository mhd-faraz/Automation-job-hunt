# jobhunt configuration. Everything tunable lives here, no editing Python.

filters:
  include_titles:
    - '\b(software|backend|back-end|full[\s-]?stack|server|platform|web|application|cloud)\b.*\b(engineer|developer)\b'
    - '\b(engineer|developer)\b.*\b(backend|back-end|full[\s-]?stack|platform)\b'
    - '\b(frontend|front-end)\b.*\b(engineer|developer)\b'
    - '\b(ai|genai|gen ai|generative ai|llm|ml|machine learning)\b.*\b(engineer|developer)\b'
    - '\b(mern|node\.?js|react|javascript|python)\b.*\b(engineer|developer)\b'
    - '\b(graduate|associate|junior|trainee)\b.*\b(engineer|developer)\b'
    - '\bsde\b'
    - '\bsde\s*-?\s*(i{1,3}|[123])\b'
    - '\b(backend|back-end)\b'
    - 'software development engineer'
    - 'software engineer'
    - 'software developer'
    - 'member of technical staff'

  exclude_titles:
    - '\b(staff|principal|distinguished|fellow|architect)\b'
    - '\b(senior|sr|lead)\b'
    - '\b(director|vp|vice president|head of|chief|cto)\b'
    - '\b(manager|management)\b'
    - '\b(intern|internship)\b'
    - '\b(sales|account executive|marketing|recruit|support|success)\b'
    - '\b(ios|android|mobile|game|designer)\b'
    - '\b(data scientist|machine learning scientist|research scientist)\b'
    - '\b(engineer|developer|sde)\s*[-(]?\s*(ii|iii|iv|2|3|4|5)\b'
    - '\b(intermediate|mid[\s-]?level)\b'

  locations:
    - noida
    - delhi
    - gurgaon
    - gurugram
    - bangalore
    - chandigarh
    - mohali
    - chennai
    - bengaluru
    - hyderabad
    - pune
    - india

  allow_remote: false
  max_age_days: 10
  max_required_years: 1

# --- LLM stages -------------------------------------------------------------
screen_batch_size: 8
screen_jd_chars: 1400
draft_jd_chars: 6000
score_threshold: 6
max_per_digest: 10

# --- paths ------------------------------------------------------------------
companies_file: companies.yaml
profile_file: profile.json
seen_file: seen.json
digest_file: out/digest.html
tracker_csv: out/tracker.csv